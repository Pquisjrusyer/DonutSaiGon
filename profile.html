<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Tin Cá Nhân | Donut Saigon - Bánh Donut Nghệ Nhân</title>
  <meta name="description" content="Cập nhật hồ sơ và sở thích cá nhân tại Donut Saigon để nhận ưu đãi và trải nghiệm dịch vụ tốt nhất.">

  <!-- Open Graph -->
  <meta property="og:title" content="Thông Tin Cá Nhân | Donut Saigon">
  <meta property="og:description" content="Duy trì thông tin chính xác và cập nhật sở thích của bạn tại Donut Saigon.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Maven Pro & Display Typefaces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page">
  <!-- Reusable Header Web Component -->
  <donut-header></donut-header>

  <!-- Main Content -->
  <main>
    <!-- ==========================================================
         PROFILE UPDATE SECTION (FIGMA NODE 1269:14074)
         ========================================================== -->
    <section class="profile-update-section" aria-label="Cập nhật thông tin cá nhân">
      <div class="profile-update-container">
        <div class="profile-update-card">
          <!-- Left Column: Visual Banner (Figma Node 1269:14078) -->
          <div class="profile-update-visual-col">
            <img src="assets/profile-visual-bg.png" alt="" class="profile-visual-bg-img" aria-hidden="true">

            <div class="profile-visual-content-wrap">
              <div class="profile-visual-badge-wrap">
                <span class="profile-visual-badge">GÓC NGỌT NGÀO</span>
              </div>
              <h1 class="profile-visual-heading">Cập Nhật Hồ Sơ<br>&amp; Sở Thích</h1>
              <div class="profile-visual-desc-wrap">
                <p class="profile-visual-desc">
                  Duy trì thông tin chính xác và cập nhật sở thích của bạn để chúng tôi có thể phục vụ tốt nhất.
                </p>
              </div>
            </div>
          </div>

          <!-- Right Column: Form Area -->
          <div class="profile-update-form-col">
            <header class="profile-form-header">
              <h2 class="profile-form-title">Thông tin cá nhân</h2>
              <p class="profile-form-subtitle">Cập nhật email và số điện thoại liên lạc mới nhất.</p>
            </header>

            <form class="profile-form-inner" id="standaloneProfileForm" novalidate>
              <!-- Full Name Field -->
              <div class="profile-input-group">
                <label for="profileFullName" class="profile-input-label">Họ và tên</label>
                <div class="profile-input-box-wrap">
                  <img src="assets/icon-signup-user.svg" alt="" class="profile-field-icon" width="18" height="18">
                  <input type="text" id="profileFullName" class="profile-field-input" placeholder="Tên cũ của khách hàng" value="Nguyễn Văn An" required autocomplete="name">
                </div>
              </div>

              <!-- Email Field -->
              <div class="profile-input-group">
                <label for="profileEmail" class="profile-input-label">Email</label>
                <div class="profile-input-box-wrap">
                  <img src="assets/icon-signup-email.svg" alt="" class="profile-field-icon" width="18" height="18">
                  <input type="email" id="profileEmail" class="profile-field-input" placeholder="email cũ" value="nguyen.vana@email.com" required autocomplete="email">
                </div>
              </div>

              <!-- Phone Field -->
              <div class="profile-input-group">
                <label for="profilePhone" class="profile-input-label">Số điện thoại</label>
                <div class="profile-input-box-wrap">
                  <img src="assets/icon-signup-phone.svg" alt="" class="profile-field-icon" width="18" height="18">
                  <input type="tel" id="profilePhone" class="profile-field-input" placeholder="sdt cũ" value="0901234567" required autocomplete="tel">
                </div>
              </div>

              <!-- Delivery Address Field -->
              <div class="profile-input-group">
                <label for="profileAddress" class="profile-input-label">Địa chỉ giao hàng</label>
                <div class="profile-input-box-wrap textarea-mode">
                  <img src="assets/icon-location.svg" alt="" class="profile-field-icon icon-pin" width="18" height="18">
                  <textarea id="profileAddress" class="profile-field-textarea" placeholder="địa chỉ cũ">Quận 1, TP. Hồ Chí Minh</textarea>
                </div>
              </div>

              <!-- Confirmation Checkbox -->
              <div class="profile-confirm-row">
                <label class="custom-checkbox-label">
                  <input type="checkbox" id="profileConfirmCheck" class="custom-checkbox-input" checked>
                  <span class="custom-checkbox-box"></span>
                  <span class="profile-confirm-text">Xác nhận thông tin cập nhật</span>
                </label>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn-profile-submit" id="btnSubmitProfileForm">
                <span>Cập nhật thông tin</span>
                <span class="submit-arrow">→</span>
              </button>
            </form>
          </div>
        </div>

        <!-- Subpage Minimal Footer Note (Figma Node 1269:14074) -->
        <div class="login-page-footer-note">
          <span class="footer-note-copy">© 2024 Donut Saigon. Bánh donut vừa rẻ vừa ngon.</span>
          <div class="footer-note-links">
            <a href="policy.html#privacy">Chính sách bảo mật</a>
            <a href="policy.html#terms">Điều khoản dịch vụ</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Lenis & GSAP Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Components & Logic -->
  <script src="components/header.js" defer></script>
  <script src="components/footer.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
